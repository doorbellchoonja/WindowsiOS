name: Build Win11 Boot Pack (iPhone Only)

on:
  workflow_dispatch:
    inputs:
      disk_size_gb:
        description: '가상 디스크 용량 (GB)'
        required: true
        default: '32'

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install QEMU tools & build hvsparse
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils qemu-efi-aarch64 build-essential
          # Linux에서 SEEK_DATA, pread, pwrite, ftruncate 인식되도록 -D_GNU_SOURCE 추가
          make build/hvsparse CFLAGS="-std=c11 -D_GNU_SOURCE -Wall -Wextra -O2 -g -Icore -Ihost -Idevices"

      - name: Prepare UEFI firmware (code.fd & vars.fd)
        run: |
          mkdir -p Win11Pack
          cp /usr/share/AAVMF/AAVMF_CODE.fd Win11Pack/code.fd
          cp /usr/share/AAVMF/AAVMF_VARS.fd Win11Pack/vars.fd
          truncate -s 64M Win11Pack/code.fd
          truncate -s 64M Win11Pack/vars.fd

      - name: Create sparse Windows 11 disk (windows11.hvsparse)
        run: |
          truncate -s ${{ github.event.inputs.disk_size_gb }}G win11.raw
          # 서브커맨드(convert 또는 pack) 자동 확인 후 변환
          USAGE=$(./build/hvsparse 2>&1 || true)
          echo "$USAGE"
          if echo "$USAGE" | grep -q "pack"; then
            ./build/hvsparse pack win11.raw Win11Pack/windows11.hvsparse
          else
            ./build/hvsparse convert win11.raw Win11Pack/windows11.hvsparse
          fi
          rm -f win11.raw
          ls -lh Win11Pack/

      - name: Upload Win11 Boot Pack
        uses: actions/upload-artifact@v4
        with:
          name: Win11-Boot-Pack
          path: Win11Pack/
