name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode & install build tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          brew install xcodegen pkg-config meson ninja cmake

      - name: Inspect repository structure
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== ios/ ==="
          find ios -maxdepth 3 || true
          echo "=== scripts/ ==="
          ls -la scripts/ || true
          echo "=== README.md ==="
          cat README.md || true

      - name: Build iOS dependencies & static library
        run: |
          chmod +x scripts/build_ios_deps.sh
          if ! bash scripts/build_ios_deps.sh; then
            echo "=== Dependency build failed! Dumping logs ==="
            cat work/ios_deps_build/*.log || true
            exit 1
          fi
          make ios-lib

      - name: Generate & Build Xcode project
        run: |
          # project.yml이 있으면 XcodeGen으로 프로젝트 생성
          if [ -f "ios/project.yml" ]; then
            (cd ios && xcodegen generate)
          elif [ -f "project.yml" ]; then
            xcodegen generate
          fi

          # .xcworkspace / .xcodeproj 탐색
          PROJECT=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          if [ -z "$PROJECT" ]; then
            PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          fi

          if [ -z "$PROJECT" ]; then
            echo "Error: No .xcodeproj or .xcworkspace found! Check 'Inspect repository structure' output above."
            exit 1
          fi

          echo "Building project: $PROJECT"

          if [[ "$PROJECT" == *.xcworkspace ]]; then
            SCHEME=$(xcodebuild -workspace "$PROJECT" -list -json | python3 -c "import sys, json; data=json.load(sys.stdin); print(data['workspace']['schemes'][0])")
            xcodebuild -workspace "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build_app \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            SCHEME=$(xcodebuild -project "$PROJECT" -list -json | python3 -c "import sys, json; data=json.load(sys.stdin); print(data['project']['schemes'][0])")
            xcodebuild -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build_app \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build_app -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r WindowsiOS-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-IPA
          path: WindowsiOS-unsigned.ipa
