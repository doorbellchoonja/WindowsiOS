name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode & install build tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          brew install xcodegen pkg-config meson ninja cmake

      - name: Build iOS dependencies & static library
        run: |
          chmod +x scripts/build_ios_deps.sh
          bash scripts/build_ios_deps.sh
          make ios-lib

      - name: Patch HingeSensorView for standard iOS SDK
        run: |
          python3 - <<'EOF'
          path = "ios/Sources/HingeSensorView.swift"
          with open(path, "r") as f:
              lines = f.readlines()

          new_lines = []
          skip_brace = 0
          for line in lines:
              if "UIHingeInteraction" in line:
                  skip_brace += line.count("{") - line.count("}")
                  new_lines.append("// [Patched for standard iOS SDK] " + line)
              elif skip_brace > 0:
                  skip_brace += line.count("{") - line.count("}")
                  new_lines.append("// [Patched] " + line)
              elif "addInteraction(interaction)" in line:
                  new_lines.append("// [Patched] " + line)
              else:
                  new_lines.append(line)

          with open(path, "w") as f:
              f.writelines(new_lines)
          EOF

      - name: Generate & Build Xcode project
        run: |
          if [ -f "ios/project.yml" ]; then
            (cd ios && xcodegen generate)
          elif [ -f "project.yml" ]; then
            xcodegen generate
          fi

          PROJECT=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          if [ -z "$PROJECT" ]; then
            PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          fi

          if [[ "$PROJECT" == *.xcworkspace ]]; then
            SCHEME=$(xcodebuild -workspace "$PROJECT" -list -json | python3 -c "import sys, json; data=json.load(sys.stdin); print(data['workspace']['schemes'][0])")
            xcodebuild -workspace "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build_app \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            SCHEME=$(xcodebuild -project "$PROJECT" -list -json | python3 -c "import sys, json; data=json.load(sys.stdin); print(data['project']['schemes'][0])")
            xcodebuild -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build_app \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build_app -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r WindowsiOS-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-IPA
          path: WindowsiOS-unsigned.ipa
