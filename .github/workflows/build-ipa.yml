name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode & install tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          # XcodeGen 및 pkg-config 설치 (project.yml 및 slirp 의존성 대비)
          brew install xcodegen pkg-config libslirp || true

      - name: Inspect repository files
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== ios/ files ==="
          ls -la ios/ || true
          echo "=== scripts/ files ==="
          ls -la scripts/ || true
          echo "=== README.md ==="
          cat README.md || true

      - name: Build dependencies, ios-lib & generate Xcode project
        run: |
          # 1. scripts/ 또는 ios/ 내의 의존성/프로젝트 생성 스크립트 확인 및 실행
          for script in scripts/*.sh ios/*.sh; do
            if [ -f "$script" ]; then
              echo "Found script: $script"
              cat "$script"
            fi
          done

          # ios/deps/include/slirp 가 없으면 빌드 스크립트 탐색 후 실행
          if [ ! -d "ios/deps/include/slirp" ]; then
            BUILD_DEPS=$(find scripts ios -maxdepth 2 -name "*slirp*" -o -name "*deps*" -o -name "*setup*" | grep "\.sh$" | head -n 1)
            if [ -n "$BUILD_DEPS" ]; then
              echo "Running dependency script: $BUILD_DEPS"
              chmod +x "$BUILD_DEPS"
              bash "$BUILD_DEPS"
            fi
          fi

          # 2. C/ObjC 코어 정적 라이브러리(build/ios/libwinvm.a) 빌드
          make ios-lib

          # 3. XcodeGen(project.yml)이 있으면 .xcodeproj 생성
          if [ -f "ios/project.yml" ]; then
            echo "Generating Xcode project via xcodegen..."
            (cd ios && xcodegen generate)
          elif [ -f "project.yml" ]; then
            xcodegen generate
          fi

      - name: Build iOS App
        run: |
          PROJECT=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
          if [ -z "$PROJECT" ]; then
            PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          fi

          if [ -z "$PROJECT" ]; then
            echo "Error: Still no .xcodeproj or .xcworkspace found!"
            exit 1
          fi

          echo "Building project: $PROJECT"

          if [[ "$PROJECT" == *.xcworkspace ]]; then
            SCHEME=$(xcodebuild -workspace "$PROJECT" -list -json | python3 -c "import sys, json; data=json.load(sys.stdin); print(data['workspace']['schemes'][0])")
            xcodebuild -workspace "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build_app \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            SCHEME=$(xcodebuild -project "$PROJECT" -list -json | python3 -c "import sys, json; data=json.load(sys.stdin); print(data['project']['schemes'][0])")
            xcodebuild -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build_app \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build_app -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r WindowsiOS-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsiOS-IPA
          path: WindowsiOS-unsigned.ipa
